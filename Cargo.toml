[workspace]
members = ["crates/mail-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["Ferrule Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
ammonia = "4"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "apple-native"] }
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pki-types = "1"
webpki-roots = "1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
open = "5"
