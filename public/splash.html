<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferrule</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1016;
        color: #f3f5f8;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 36px 32px;
        background:
          radial-gradient(circle at 50% 18%, rgba(124, 156, 255, 0.16), transparent 60%),
          radial-gradient(circle at 82% 88%, rgba(92, 214, 179, 0.1), transparent 55%),
          #0d1016;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .emblem {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(124, 156, 255, 0.22), rgba(92, 214, 179, 0.14));
        border: 1px solid rgba(124, 156, 255, 0.35);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        animation: pop 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .emblem svg {
        width: 30px;
        height: 30px;
        color: #e9efff;
      }
      .title-wrap {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 6px;
        animation: fadeUp 480ms 80ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #f7f9fc;
      }
      .tagline {
        font-size: 13px;
        color: #9ba4b8;
        letter-spacing: 0.005em;
      }
      .progress-track {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
        margin-top: 8px;
      }
      .progress-bar {
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #7c9cff, #5cd6b3);
        animation: slide 1.15s ease-in-out infinite;
      }
      .status {
        font-size: 11.5px;
        color: #7c8599;
        letter-spacing: 0.02em;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M5 17.5V6.5a2 2 0 0 1 2-2h10v3.25H8.5v2.75H15v3.1H8.5v3.9H5Z"
            fill="currentColor"
          />
          <rect
            x="16.2"
            y="14.2"
            width="3.4"
            height="3.4"
            rx="0.9"
            fill="currentColor"
            fill-opacity="0.7"
          />
        </svg>
      </div>
      <div class="title-wrap">
        <h1>Ferrule</h1>
        <p class="tagline">Local-first mail &amp; Pigment Staff workspace</p>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar"></div>
      </div>
      <div class="status">Preparing your workspace…</div>
    </main>
  </body>
</html>
